name: Pull Request CI Checks

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  terraform-syntax-checks:
    name: Code Quality & Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  security-scan:
    name: Dependency & IaC Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Run Trivy (Official Successor to tfsec).
      - name: Run Trivy IaC Security Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          hide-shortcut-text: 'true'
          exit-code: '1' # Fails the pipeline if HIGH or CRITICAL issues are found.
          severity: 'HIGH,CRITICAL'

      # 2. Run Checkov Static Security Analysis
      - name: Run Checkov Scanner
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          output_format: cli
          soft_fail: false # Set to true if you want warnings without blocking the build .
